[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aqnet"
version = "0.1.0"
description = "Mathematical modeling & discrete-event simulation of multi-node queueing networks under adversarial attacks and retransmissions"
readme = "README.md"
authors = [
  { name = "Ilias Chrysovergis", email = "ilias@chrysovergis.gr" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["queueing-theory", "network-security", "adversarial-attacks", "discrete-event-simulation", "simpy", "sojourn-time", "retransmissions"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: System :: Networking",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy>=1.20.0",
  "scipy>=1.9.0",
  "simpy>=4.0.0",
  "matplotlib>=3.5.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0"
]

[project.scripts]
aqnet = "aqnet.cli:main"

[project.urls]
"Homepage" = "https://github.com/iliachry/Attacks-Delay"
"Bug Tracker" = "https://github.com/iliachry/Attacks-Delay/issues"
"Research Lab" = "https://metatopia.gr"

[tool.setuptools.packages.find]
where = ["src"]
